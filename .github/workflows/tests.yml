name: tests run
on:
  push:
    branches: [ "main", "dev/main" ]
  pull_request:
    branches: [ "main", "dev/main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ auth-service, notification-service, policy-service ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: run tests for ${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: mvn test -f ${{ matrix.service }}/pom.xml -Dspring.profiles.active=test
